[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plantorv"
version = "0.1.0"
description = "Object segmentation, VLM tagging, and depth estimation pipeline."
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "ruff",
    "pyright",
    "pre-commit",
    # pandas ships no py.typed marker, so Pyright infers from its source. Several
    # reductions (`Series.std()` among them) have no return annotation there and infer
    # as `Series | float`, which `float()` then rejects. These stubs annotate them.
    "pandas-stubs",
    # Documentation. See docs/conf.py and `make docs`.
    "sphinx",
    "furo",
    "myst-parser",
    "sphinx-autobuild",
]

[tool.setuptools]
packages = ["segmentation", "scene_understanding", "mapping", "aruco", "evaluation", "utility", "LLM"]

# Linter/type-checker settings live in .dev-config/ to keep this file focused on packaging. 
[tool.ruff]
extend = ".dev-config/ruff.toml"

[tool.pyright]
extends = ".dev-config/pyrightconfig.json"
