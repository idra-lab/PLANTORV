

# Image-text-to-text (Qwen3_5MoeForConditionalGeneration), so the annotator accepts it:
# the backend reads that from the model configuration and sets SUPPORTS_IMAGES itself.
#
# It needs transformers >= 5, which knows the `qwen3_5_moe` model type; on 4.57 the
# configuration cannot even be parsed. It is also a 35B mixture of experts: at 4-bit it
# wants roughly 20 GB, so QUANTIZE below is what decides whether it fits the card.
PROVIDER: "huggingface"
MODEL_NAME: "Qwen/Qwen3.6-35B-A3B"
DISABLE_SYSTEM: false
DEVICE: "cuda"
QUANTIZE: 0
# Enable model sharding across multiple GPUs when available
MULTI_GPU: true
# Optional advanced override (e.g. "auto", "balanced", or an explicit mapping)
DEVICE_MAP: "auto"
CACHE_DIR: "/scratch/models"

LLM_CONFIG:
  max_tokens: 8192
  temperature: 0.0
  top_p: 1.0
  frequency_penalty: 0.0
  presence_penalty: 0.0
  stop:
    - "USER:"
    - "SYSTEM:"
    - "</think>"
  seed: 42
  enable_thinking: false


