PROVIDER: "vllm"
MODEL_NAME: "Qwen/Qwen3.6-35B-A3B"
DISABLE_SYSTEM: false

# vLLM runtime settings
DTYPE: "auto"
TENSOR_PARALLEL_SIZE: 2
# Directory used for model downloads/cache (relative paths are resolved from this YAML folder)
DOWNLOAD_DIR: "/scratch/models"
# Number of workers used during model snapshot download (set to 1 to avoid multi-worker issues)
DOWNLOAD_WORKERS: 1
MAX_MODEL_LEN: 32768
MAX_NUM_SEQS: 8
GPU_MEMORY_UTILIZATION: 0.90
TRUST_REMOTE_CODE: true
ENABLE_PREFIX_CACHING: true
DISABLE_LOG_STATS: true
ENFORCE_EAGER: false

LLM_CONFIG:
  max_tokens: 8192
  temperature: 0.0
  top_p: 1.0
  frequency_penalty: 0.0
  presence_penalty: 0.0
  stop:
    - "USER:"
    - "SYSTEM:"
    - "</think>"
  seed: 42
  enable_thinking: false


