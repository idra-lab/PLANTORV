PROVIDER: "huggingface"
MODEL_NAME: "Jackrong/Qwen3.5-27B-Claude-4.6-Opus-Reasoning-Distilled"
DISABLE_SYSTEM: false
DEVICE: "cuda"
QUANTIZE: 0
# Enable model sharding across multiple GPUs when available
MULTI_GPU: true
# Optional advanced override (e.g. "auto", "balanced", or an explicit mapping)
DEVICE_MAP: "auto"
ENABLE_THINKING: false
CACHE_DIR: "/scratch/models"

LLM_CONFIG:
  max_tokens: 8192
  temperature: 0.0
  top_p: 1.0
  frequency_penalty: 0.0
  presence_penalty: 0.0
  stop:
    - "USER:"
    - "SYSTEM:"
    - "```\n\n"           # stop after closing markdown fence
    - "</think>"          # catch reasoning models that don't suppress thinking
  seed: 42
  enable_thinking: false
