# The one description of the workcell.
#
# Everything else is derived from this file: scripts/generate_world.py turns it
# into worlds/plantorv_table.world, scene_spawner.py spawns the cubes from it,
# world_model.py answers pose queries with it, and the URDF reads the table and
# stand dimensions out of it. Change a number here and rerun the generator --
# do not edit the .world by hand.
#
# Frame `world` sits on the floor, at the centre of the table top: x runs along
# the long side of the table, y towards the robot, z up.

frame_id: world

table:
  # Long side x short side x height. The top surface is therefore at z = 1.0.
  size: [2.0, 1.0, 1.0]
  color: [0.72, 0.60, 0.44, 1.0]

robot:
  # The stand stands on the table top, centred on the middle of the long side.
  stand_size: [0.25, 0.25, 0.20]
  stand_xy: [0.0, 0.45]
  stand_color: [0.35, 0.35, 0.38, 1.0]
  # Mount height of base_link above the floor: table height + stand height.
  # Kept explicit because the planner and the URDF both need it.
  mount_height: 1.20
  # Yaw of the base, radians. 0 points the arm's +x along the table's +x; -pi/2
  # turns its front towards the trays.
  yaw: -1.5707963267948966

# Both trays sit in the middle of the table, one either side of the centre.
#
# Every inner dimension is twice what it used to be, which makes the outer
# footprint 0.51 x 0.39 and forces the pair apart to x = +-0.27 to leave a gap
# between them. That is as far out as they can go: the planner releases over
# the tray's centre, and at x = +-0.27, y = 0.08 the approach pose is 0.496 m
# from base_link against the UR3's 0.5 m reach. Moving the trays any further
# from the robot puts placing out of reach -- see the note on the cubes.
#
# The walls are left at 0.015; they are structural, not part of "twice as big".
trays:
  - name: tray_blue
    xy: [-0.27, 0.08]
    inner: [0.48, 0.36, 0.12]
    wall: 0.015
    color: [0.10, 0.20, 0.80, 1.0]
  - name: tray_red
    xy: [0.27, 0.08]
    inner: [0.48, 0.36, 0.12]
    wall: 0.015
    color: [0.80, 0.10, 0.10, 1.0]

# The objects to be sorted, between the robot and the trays.
#
# The doubled trays reach to y = 0.275 and the robot stand starts at y = 0.325,
# so the 5 cm strip between them does not hold a 10 cm cube. The cubes sit at
# y = 0.36 instead, beside the stand rather than in front of it: nothing else
# on this table is both clear of the trays and inside the arm's reach. They are
# kept off the centreline because the stand occupies x = -0.125 .. 0.125 at
# this depth.
cubes:
  size: 0.10
  mass: 0.20
  items:
    - name: cube_1
      xy: [-0.36, 0.36]
      yaw: 0.0
      color: [0.10, 0.35, 0.90, 1.0]
    - name: cube_2
      xy: [-0.22, 0.36]
      yaw: 0.35
      color: [0.90, 0.15, 0.15, 1.0]
    - name: cube_3
      xy: [0.30, 0.36]
      yaw: -0.20
      color: [0.10, 0.35, 0.90, 1.0]
