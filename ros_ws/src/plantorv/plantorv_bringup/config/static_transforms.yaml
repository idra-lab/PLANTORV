  charuco_to_world:
    # World sits under the robot base, with the board's own orientation,
    # which is what the robot description expects of its root link.
    #
    # It starts from the origin of static_robot_base_marker expressed in
    # the charuco frame, (-0.231661, 0.199827, 0.055925), and offsets it
    # to the base axis on the floor: 45 mm back along -x from the marker
    # face to the axis, and 807 mm down. The board lies flat with its z
    # axis pointing up, so down is -z.
    #
    #   x: -0.231661 - 0.045 = -0.276661
    #   y:  0.199827         =  0.199827
    #   z:  0.055925 - 0.807 = -0.751075
    #
    # Re-record and redo this offset after moving the camera, the board
    # or the robot: nothing detects a stale file on its own.
    #
    # The rotation is 90 degrees clockwise about the board's z axis,
    # looking down that axis towards the origin, which is -90 degrees by
    # the right-hand rule. z is the board normal and it points up, so
    # this turns the frame in the horizontal plane and leaves up alone:
    # world x lands on -y of the board, world y on +x, world z stays on
    # the normal. That is what scene.yaml wants -- x along the long side
    # of the table, y across it towards the table, z up. The origin does
    # not move, only the axes.
    parent_frame: static_charuco_board
    child_frame: world
    translation:
      x: -0.276661
      y: 0.199827
      z: -0.751075
    rotation:
      x: 0.0
      y: 0.0
      z: -0.707106781186547
      w: 0.707106781186548
