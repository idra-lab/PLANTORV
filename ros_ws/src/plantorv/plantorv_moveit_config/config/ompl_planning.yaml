# Which planner plugin this pipeline runs, and what runs after it.
#
# Both have to be stated here. move_group reads them from the pipeline's own
# parameter namespace, and nothing else supplies a default: without
# planning_plugin the pipeline does not load OMPL at all, and without
# request_adapters the planned path reaches the controller with every
# time_from_start still at zero. joint_trajectory_controller rejects that with
# "Time between points 0 and 1 is not strictly increasing", which surfaces as
# MoveIt error -4, while RViz still animates the path quite happily -- it
# interpolates the waypoints and never looks at the timestamps.
#
# AddTimeOptimalParameterization is the one that assigns those timestamps, so
# it must stay in the list. The rest are the MoveIt defaults, which repair a
# start state that is slightly out of bounds or in collision rather than
# failing the request outright.
planning_plugin: ompl_interface/OMPLPlanner
request_adapters: >-
  default_planner_request_adapters/AddTimeOptimalParameterization
  default_planner_request_adapters/ResolveConstraintFrames
  default_planner_request_adapters/FixWorkspaceBounds
  default_planner_request_adapters/FixStartStateBounds
  default_planner_request_adapters/FixStartStateCollision
  default_planner_request_adapters/FixStartStatePathConstraints
start_state_max_bounds_error: 0.1

# OMPL planners available to the planner node. RRTConnect is the default: it is
# fast and always finds *a* path, which is what the planner's repeated-planning
# strategy relies on -- it asks for several plans and keeps the shortest, which
# is cheaper and more predictable here than asking one asymptotically optimal
# planner to converge. RRTstar is kept configured for when a single optimal
# plan is wanted instead; select it per goal through the planner's planner_id
# parameter.
planner_configs:
  RRTConnect:
    type: geometric::RRTConnect
    range: 0.0  # 0 lets OMPL pick from the state space extent
  RRTstar:
    type: geometric::RRTstar
    range: 0.0
    goal_bias: 0.05
    delay_collision_checking: 1
  PRMstar:
    type: geometric::PRMstar

ur_manipulator:
  default_planner_config: RRTConnect
  planner_configs:
    - RRTConnect
    - RRTstar
    - PRMstar
  projection_evaluator: joints(shoulder_pan_joint,shoulder_lift_joint)
  longest_valid_segment_fraction: 0.005
