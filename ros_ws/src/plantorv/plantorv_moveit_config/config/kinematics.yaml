# KDL is what ships with MoveIt and needs no extra package. It solves the
# top-down grasps here, but it is a numerical solver seeded from the current
# state, so it is given a long timeout and many attempts rather than being
# allowed to fail a pick for want of a few milliseconds.
#
# If IK becomes the bottleneck, the drop-in replacements are trac_ik
# (trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin) or the UR analytic solver
# (ur_kinematics/UR3KinematicsPlugin), both of which fit here unchanged.
ur_manipulator:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 5
