MODEL: "sam"
CHECKPOINT: "models/sam/sam2.1_l.pt"

# Forwarded to the Ultralytics "segment everything" pass.
SEGMENTATION_CONFIG:
  points_stride: 48

# Which of the masks that pass produces are kept. Omitted keys take the value of
# SAMModel.DEFAULT_FILTERS; the resolved file written next to a run lists them all.
FILTERS:
  background_min_area_pct: 15.0
  object_min_area_pct: 0.35
  object_max_area_pct: 6.5
  object_large_area_pct: 10.0
  object_min_bg_iou: 0.02
  overlap_iou_threshold: 0.01
